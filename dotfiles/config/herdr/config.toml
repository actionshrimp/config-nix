onboarding = false
ui.pane_gaps = false
# herdr configuration
# See `herdr --default-config` for all available options.

# Seamless ctrl+h/j/k/l navigation across herdr panes and Neovim splits,
# via the plugin shipped with smart-splits.nvim.
#
# Linked with:
#   herdr plugin link ~/.local/share/nvim/lazy/smart-splits.nvim
#
# The plugin checks `herdr pane process-info` for the focused pane:
#  - Vim/Neovim  -> forwards the key so smart-splits handles its own splits,
#                   calling back into herdr at a split edge
#  - anything else -> moves herdr focus directly
#  - no neighbour in that direction -> forwards the key to the running app,
#                   so shell ctrl+l (clear) / ctrl+h (backspace) still work

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "smart-splits.nvim.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "smart-splits.nvim.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "smart-splits.nvim.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "smart-splits.nvim.right"
description = "navigate right (vim/herdr)"

# Terminal annotations
[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "annotate.capture"
description = "annotate text"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "annotate.copy-context"
description = "copy annotations as context"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "annotate.manage"
description = "manage annotations"

# Document review (plannotator-tui)
[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "annotate.open"
description = "review documents in this folder"

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "annotate.last"
description = "review the agent's last reply"
